name: Nomos
description: >-
  Nomos runs a whitelabel (embedded) energy platform for the German market:
  partners sell dynamic, EPEX-spot electricity plans under their own brand while
  Nomos, a licensed and regulated electricity retailer, handles customer
  onboarding, supplier switching, smart-meter (iMSys) orders, §14a EnWG
  grid-fee reductions, dynamic pricing, metering, billing and solar feed-in
  compensation behind a single REST API. The API (api.nomos.energy) uses OAuth
  2.0 with read:*/write:* scopes, dated X-API-Version releases, cursor
  pagination, bracket-notation filtering, a structured error envelope and signed
  webhooks, plus hosted checkout and customer-portal surfaces.
