  /subscriptions:
    get:
      tags:
      - Subscriptions
      summary: List subscriptions
      description: Retrieve all subscriptions
      security:
      - Bearer: []
      parameters:
      - schema:
          type: string
          nullable: true
        required: false
        name: cursor
        in: query
      - schema:
          type: number
          minimum: 1
          maximum: 100
          default: 10
        required: false
        name: limit
        in: query
      - schema:
          nullable: true
          description: '**Filterable fields:**

            - `status` (enum): pending, active, ended

            - `customer` (string)

            - `plan` (string)

            - `created_at` (date)

            - `updated_at` (date)


            See [Filtering Documentation](https://docs.nomos.energy/guides/filtering) for supported operators and syntax.'
          example: value
        required: false
        description: '**Filterable fields:**

          - `status` (enum): pending, active, ended

          - `customer` (string)

          - `plan` (string)

          - `created_at` (date)

          - `updated_at` (date)


          See [Filtering Documentation](https://docs.nomos.energy/guides/filtering) for supported operators and syntax.'
        name: filter[field][operator]
        in: query
      responses:
        '200':
          description: Retrieve all subscriptions
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    enum:
                    - list
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        object:
                          type: string
                          enum:
                          - subscription
                          description: Type of the object, always 'subscription'
                        id:
                          type: string
                          description: Unique identifier for the subscription
                          example: sub_rocbrf1u5e48mm0reeqoag90
                        plan:
                          type: string
                          description: ID of the plan
                          example: pln_ctj3tjzc7dywznuw1dy80lb3
                        customer:
                          type: string
                          description: ID of the customer
                          example: cus_a8n8ol7yd4h0wohx824f0bui
                        address:
                          type: string
                          description: ID of the address
                          example: adr_a7gurqkul8lzzsy1pf9p9388
                        meter:
                          type: string
                          description: ID of the meter
                          example: mtr_azk4zue2ijx4ff1dbjt14m5h
                        payment_method:
                          type: string
                          description: ID of the payment method
                          example: pm_adc9utqqpcp7tx054l7vg56s2
                        supplier:
                          type: string
                          nullable: true
                          description: ID of the previous supplier
                          example: mp_a0x6jm5h92wde6s5dnuvha4c
                        number:
                          type: string
                          nullable: true
                          description: Human-readable identifier for the subscription
                          example: 4X44EMKX
                        status:
                          type: string
                          enum:
                          - pending
                          - active
                          - ended
                          description: Status of the subscription
                          example: active
                        estimated_usage:
                          type: number
                          description: Estimated yearly usage in kWh, provided by the customer in the checkout.
                        created_at:
                          anyOf:
                          - type: string
                          - type: string
                            format: date-time
                          description: Timestamp when the subscription was created
                          example: '2024-03-14T12:00:00Z'
                        updated_at:
                          anyOf:
                          - type: string
                          - type: string
                            format: date-time
                          description: Timestamp when the subscription was updated
                          example: '2024-03-14T12:00:00Z'
                        start_at:
                          anyOf:
                          - type: string
                          - type: string
                            format: date-time
                          - nullable: true
                          description: Timestamp when delivery was started / will start
                          example: '2024-03-14T12:00:00Z'
                        terminated_at:
                          anyOf:
                          - type: string
                          - type: string
                            format: date-time
                          - nullable: true
                          description: Timestamp when delivery was terminated
                          example: '2024-03-14T12:00:00Z'
                        end_at:
                          anyOf:
                          - type: string
                          - type: string
                            format: date-time
                          - nullable: true
                          description: Timestamp when the subscription was ended / will end
                          example: '2024-03-14T12:00:00Z'
                        metadata:
                          type: object
                          nullable: true
                          additionalProperties:
                            nullable: true
                          description: Metadata of the subscription. Store any type of information, custom to your needs. E.g. the `user_id` of your in-house user. Restricted to 10KB.
                          example:
                            utm_source: google
                            utm_campaign: campaign_name
                            user_id: '1234567890'
                        type:
                          type: string
                          enum:
                          - consumption
                          - feed_in
                          description: Whether the subscription covers electricity consumption or feed-in. Feed-in subscriptions are only available from the 2026-05-27.curie API version onwards.
                          example: consumption
                        billing_address:
                          type: string
                          description: ID of the billing address
                          example: adr_a7gurqkul8lzzsy1pf9p9388
                      required:
                      - object
                      - id
                      - plan
                      - customer
                      - address
                      - meter
                      - payment_method
                      - status
                      - estimated_usage
                      - created_at
                      - updated_at
                      - type
                      - billing_address
                  next_page:
                    type: string
                    nullable: true
                    example: eyJsYXN0X2NyZWF0ZWRfYXQiOiIyMDI1LTAxLTE1VDEwOjMwOjAwLjAwMFoiLCJsYXN0X2lkIjoic3ViX21pNGYwb2RhNng5bTdnY3N2amswb2xlMSIsImxpbWl0IjoyMH0=
                  has_more:
                    type: boolean
                    default: false
                required:
                - object
                - items
        '400':
          description: The server cannot or will not process the request due to something that is perceived to be a client error (e.g., malformed request syntax, invalid request message framing, or deceptive request routing).
          content:
