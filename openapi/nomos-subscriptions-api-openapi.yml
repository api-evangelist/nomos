          - smart
          - analog
          description: Type of the meter. Must be 'smart' for feed-in plans
          example: smart
        estimated_usage:
          type: number
          minimum: 100
          description: Estimated yearly consumption in kWh
          example: 2500
        malo:
          type: string
          nullable: true
          description: Market Location Identifier (MaLo) for the meter
          example: '50491310272'
      required:
      - number
      - type
      - estimated_usage
    Subscription:
      type: object
      properties:
        object:
          type: string
          enum:
          - subscription
          description: Type of the object, always 'subscription'
        id:
          type: string
          description: Unique identifier for the subscription
          example: sub_rocbrf1u5e48mm0reeqoag90
        plan:
          type: string
          description: ID of the plan
          example: pln_ctj3tjzc7dywznuw1dy80lb3
        customer:
          $ref: '#/components/schemas/Customer'
        address:
          $ref: '#/components/schemas/Address'
        meter:
          $ref: '#/components/schemas/Meter'
        payment_method:
          $ref: '#/components/schemas/PaymentMethod'
        supplier:
          $ref: '#/components/schemas/Supplier'
        number:
          type: string
          nullable: true
          description: Human-readable identifier for the subscription
          example: 4X44EMKX
        status:
          type: string
          enum:
          - pending
          - active
          - ended
          description: Status of the subscription
          example: active
        estimated_usage:
          type: number
          description: Estimated yearly usage in kWh, provided by the customer in the checkout.
        created_at:
          anyOf:
          - type: string
          - type: string
            format: date-time
          description: Timestamp when the subscription was created
          example: '2024-03-14T12:00:00Z'
        updated_at:
          anyOf:
          - type: string
          - type: string
            format: date-time
          description: Timestamp when the subscription was updated
          example: '2024-03-14T12:00:00Z'
        start_at:
          anyOf:
          - type: string
          - type: string
            format: date-time
          - nullable: true
          description: Timestamp when delivery was started / will start
          example: '2024-03-14T12:00:00Z'
        terminated_at:
          anyOf:
          - type: string
          - type: string
            format: date-time
          - nullable: true
          description: Timestamp when delivery was terminated
          example: '2024-03-14T12:00:00Z'
        end_at:
          anyOf:
          - type: string
          - type: string
            format: date-time
          - nullable: true
          description: Timestamp when the subscription was ended / will end
          example: '2024-03-14T12:00:00Z'
        metadata:
          type: object
          nullable: true
          additionalProperties:
            nullable: true
          description: Metadata of the subscription. Store any type of information, custom to your needs. E.g. the `user_id` of your in-house user. Restricted to 10KB.
          example:
            utm_source: google
            utm_campaign: campaign_name
            user_id: '1234567890'
        type:
          type: string
          enum:
          - consumption
          - feed_in
          description: Whether the subscription covers electricity consumption or feed-in. Feed-in subscriptions are only available from the 2026-05-27.curie API version onwards.
          example: consumption
        billing_address:
          $ref: '#/components/schemas/Address'
      required:
      - object
      - id
      - plan
      - customer
      - address
      - meter
      - payment_method
      - status
      - estimated_usage
      - created_at
      - updated_at
      - type
      - billing_address
    InsertAddress:
      type: object
      properties:
        street:
          type: string
          minLength: 2
          maxLength: 100
          pattern: '[a-zA-Z\u00E4\u00F6\u00FC\u00DF\u00C4\u00D6\u00DC]'
          description: Street name of the address
          example: Torstraße
        house_number:
          type: string
          minLength: 1
          maxLength: 10
          pattern: ^[A-Za-z0-9\-/\s]+$
          description: House number including any additions
          example: '119'
        zip:
          type: string
          minLength: 5
          maxLength: 5
          pattern: ^\d+$
          description: ZIP/Postal code
          example: '10115'
        city:
          type: string
          minLength: 2
          maxLength: 100
          pattern: ^[^\d]*$
          description: City name
          example: Berlin
      required:
      - street
      - house_number
      - zip
      - city
      description: New billing address for the subscription
