    PrepaymentInvoice:
      type: object
      properties:
        object:
          type: string
          enum:
          - invoice
        id:
          type: string
          example: inv_drjjua6ampd1op2fg98k89x8
          description: Unique identifier of the invoice.
        customer:
          type: string
          example: cus_a8n8ol7yd4h0wohx824f0bui
          description: ID of the customer the invoice belongs to.
        subscription:
          type: string
          example: sub_jd8mlscm062jb6ks50tck9gi
          description: ID of the subscription the invoice belongs to.
        invoice_number:
          type: string
          example: H62SU12A-003
          description: Human-readable invoice number displayed on the invoice document
        month:
          type: number
          example: 4
          description: Numeric month (1-12) for which the invoice is issued
        year:
          type: number
          example: 2025
          description: Four-digit year for which the invoice is issued
        period_start:
          type: string
          example: '2025-03-31T22:00:00Z'
          description: Timestamp marking the beginning of the billing period (inclusive)
        period_end:
          type: string
          example: '2025-04-30T22:00:00Z'
          description: Timestamp marking the end of the billing period (exclusive)
        period_number:
          type: number
          example: 3
          description: Sequential number of the billing period within the subscription (1-based)
        status:
          type: string
          enum:
          - open
          - paid
          - voided
          - uncollectible
          example: open
          description: 'Current status of the invoice:'
        issued_at:
          anyOf:
          - type: string
          - type: string
            format: date-time
          - nullable: true
          example: '2024-03-14T12:00:00Z'
          description: Timestamp when the invoice was issued
        paid_at:
          anyOf:
          - type: string
          - type: string
            format: date-time
          - nullable: true
          example: '2024-03-14T12:00:00Z'
          description: Timestamp when the invoice was paid
        type:
          type: string
          enum:
          - prepayment
          example: prepayment
          description: Discriminator for prepayment invoices, which charge a fixed advance amount and carry no metered usage.
        total:
          type: number
          example: 99
          description: Prepayment amount due in euros (EUR), including taxes
      required:
      - object
      - id
      - customer
      - subscription
      - invoice_number
      - month
      - year
      - period_start
      - period_end
      - period_number
      - status
      - type
      - total
      title: Prepayment invoice
    InvoiceUnion:
      oneOf:
      - $ref: '#/components/schemas/UsageInvoice'
      - $ref: '#/components/schemas/PrepaymentInvoice'
      - $ref: '#/components/schemas/VoidInvoice'
      discriminator:
        propertyName: type
        mapping:
          usage: '#/components/schemas/UsageInvoice'
          prepayment: '#/components/schemas/PrepaymentInvoice'
          void: '#/components/schemas/VoidInvoice'
