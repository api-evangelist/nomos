  /invoices/{id}/file:
    get:
      tags:
      - Invoices
      summary: Retrieve an invoice PDF
      description: Retrieve a PDF file of an invoice from the storage
      security:
      - Bearer: []
      parameters:
      - schema:
          type: string
          example: inv_drjjua6ampd1op2fg98k89x8
          description: The invoice id to access the pdf file
        required: true
        description: The invoice id to access the pdf file
        name: id
        in: path
      responses:
        '302':
          description: Redirect to the file. The link is valid for 1 hour.
        '400':
          description: The server cannot or will not process the request due to something that is perceived to be a client error (e.g., malformed request syntax, invalid request message framing, or deceptive request routing).
