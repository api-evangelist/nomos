    Lead:
      type: object
      properties:
        object:
          type: string
          enum:
          - lead
        id:
          type: string
          description: Unique identifier for the lead
          example: lead_a8n8ol7yd4h0wohx824f0bui
        subscription:
          type: string
          nullable: true
          description: ID of the subscription, if the lead is converted to a subscription
          example: sub_a8n8ol7yd4h0wohx824f0bui
        subscribed_at:
          anyOf:
          - type: string
          - type: string
            format: date-time
          - nullable: true
          description: Timestamp when the lead was converted to a subscription
          example: '2024-03-14T12:00:00Z'
        link:
          type: string
          description: URL of the lead
          example: https://nomos.checkout.energy/?id=lead_a8n8ol7yd4h0wohx824f0bui
        created_at:
          anyOf:
          - type: string
          - type: string
            format: date-time
          description: Timestamp when the lead was created
          example: '2024-03-14T12:00:00Z'
        created_by:
          type: string
          nullable: true
          description: Email of the user who created the lead
          example: john.doe@example.com
        last_visited_at:
          anyOf:
          - type: string
          - type: string
            format: date-time
          - nullable: true
          description: Timestamp when the lead was last visited
          example: '2024-03-14T12:00:00Z'
        metadata:
          type: object
          nullable: true
          additionalProperties:
            nullable: true
          description: Metadata of the lead, can be internal data
          example:
            utm_source: google
            utm_campaign: campaign_name
            user_id: '1234567890'
      required:
      - object
      - id
      - link
      - created_at
