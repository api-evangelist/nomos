    Customer:
      anyOf:
      - type: object
        properties:
          object:
            type: string
            enum:
            - customer
            description: Type of the object, always 'customer'
          id:
            type: string
            description: Unique identifier for the customer
            example: cus_mi4f0oda6x9m7gcsvjk0ole1
          type:
            type: string
            enum:
            - person
            default: person
            description: Type of the customer, always 'person'
          first_name:
            type: string
            minLength: 1
            maxLength: 100
            description: Customer's first name
            example: John
          last_name:
            type: string
            minLength: 1
            maxLength: 100
            description: Customer's last name
            example: Doe
          email:
            type: string
            format: email
            description: Email address
            example: john.doe@example.com
          vat_id:
            type: string
            nullable: true
            description: VAT identification number (USt-IdNr.) of the customer
            example: DE123456789
          created_at:
            anyOf:
            - type: string
            - type: string
              format: date-time
            description: Timestamp when the customer was created
            example: '2024-03-14T12:00:00Z'
        required:
        - object
        - id
        - first_name
        - last_name
        - email
        - created_at
        title: Person
      - type: object
        properties:
          object:
            type: string
            enum:
            - customer
            description: Type of the object, always 'customer'
          id:
            type: string
            description: Unique identifier for the customer
            example: cus_mi4f0oda6x9m7gcsvjk0ole1
          type:
            type: string
            enum:
            - company
            description: Type of the customer, always 'company'
          first_name:
            type: string
            minLength: 1
            maxLength: 100
            description: First name of the customer
            example: John
          last_name:
            type: string
            minLength: 1
            maxLength: 100
            description: Last name of the customer
            example: Doe
          company_name:
            type: string
            minLength: 1
            maxLength: 100
            description: Company name
            example: Example GmbH
          email:
            type: string
            format: email
            description: Email address
            example: gmbh@example.com
          vat_id:
            type: string
            nullable: true
            description: VAT identification number (USt-IdNr.) of the customer
            example: DE123456789
          created_at:
            anyOf:
            - type: string
            - type: string
              format: date-time
            description: Timestamp when the customer was created
            example: '2024-03-14T12:00:00Z'
        required:
        - object
        - id
        - type
        - first_name
        - last_name
        - company_name
        - email
        - created_at
        title: Company
    UpdateCustomer:
      type: object
      properties:
        first_name:
          type: string
          minLength: 1
          maxLength: 100
          description: Customer's first name
          example: John
        last_name:
          type: string
          minLength: 1
          maxLength: 100
          description: Customer's last name
          example: Doe
        company_name:
          type: string
          minLength: 1
          maxLength: 100
          description: Company name. Only valid for company customers; must be non-empty when provided.
          example: Example GmbH
      example:
        first_name: John
        last_name: Doe
