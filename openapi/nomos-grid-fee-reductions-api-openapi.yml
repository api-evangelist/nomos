    post:
      tags:
      - Grid Fee Reductions
      summary: Create a grid fee reduction
      description: 'Create a new grid fee reduction for §14a EnWG modules. Not applicable for feed-in subscriptions, which do not pay grid fees.


        **Grid fee reduction status:**

        - If the subscription is active: grid fee reduction is created with `ordered` status. Order is submitted immediately

        - If the subscription is pending: grid fee reduction is created with `intended` status. Order will be submitted once the subscription is confirmed


        **Re-ordering after rejection:**

        Re-ordering is allowed if the previous grid fee reduction was rejected or ended.'
      security:
      - Bearer: []
      requestBody:
        description: The grid fee reduction to create
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InsertGridFeeReduction'
      responses:
        '200':
          description: The newly created grid fee reduction.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GridFeeReduction'
        '400':
          description: The server cannot or will not process the request due to something that is perceived to be a client error (e.g., malformed request syntax, invalid request message framing, or deceptive request routing).
